spring.application.name=margomarket

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS}
app.mail.from=${MAIL_FROM}
app.registration.blocked-domains=${BLOCKED_EMAIL_DOMAINS}
app.registration.code-expiration-minutes=${REGISTRATION_CODE_EXPIRATION_MINUTES}
app.registration.resend-cooldown-seconds=${REGISTRATION_RESEND_COOLDOWN_SECONDS}
app.registration.max-verification-attempts=${REGISTRATION_MAX_VERIFICATION_ATTEMPTS}
app.registration.cleanup-interval-ms=${REGISTRATION_CLEANUP_INTERVAL_MS}
