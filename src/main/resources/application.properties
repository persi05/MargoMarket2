spring.application.name=margomarket

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Events between modules (Spring Modulith). Each event is stored in event_publication in the
# publishing transaction and handed to the listeners after the commit. The table comes from Flyway.
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS}
app.mail.from=${MAIL_FROM}
app.registration.blocked-domains=${BLOCKED_EMAIL_DOMAINS}
app.registration.code-expiration-minutes=${REGISTRATION_CODE_EXPIRATION_MINUTES}
app.registration.resend-cooldown-seconds=${REGISTRATION_RESEND_COOLDOWN_SECONDS}
app.registration.max-verification-attempts=${REGISTRATION_MAX_VERIFICATION_ATTEMPTS}
app.registration.cleanup-interval-ms=${REGISTRATION_CLEANUP_INTERVAL_MS}

# OpenAPI spec (/v3/api-docs) and Swagger UI (/swagger-ui.html); SWAGGER_ENABLED is required, true only in development.
springdoc.api-docs.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}
springdoc.default-produces-media-type=application/json
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
spring.jackson.deserialization.accept-float-as-int=false

# Request rate limits (defaults in RateLimitPolicy; override e.g. app.rate-limit.limits.chat-message.capacity=30).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Set to "native" only behind a reverse proxy that sets X-Forwarded-For; otherwise clients could spoof their IP.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Monitoring (Actuator) on a separate port. Docker publishes only 8080, so /actuator/** is reachable
# only from inside the container or the server itself (e.g. Prometheus on the same network).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus,modulith
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db
# SMTP outages must not mark the whole service as down; failed mails are reported per request.
management.health.mail.enabled=false
management.metrics.tags.application=margomarket
management.metrics.distribution.percentiles-histogram.http.server.requests=true
