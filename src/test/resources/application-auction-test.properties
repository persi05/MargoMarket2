spring.datasource.url=${AUCTION_TEST_DATABASE_URL}
spring.datasource.username=auction_test
spring.datasource.password=auction_test
app.cors.allowed-origins=http://localhost:4200
app.jwt.secret=auction-integration-test-secret-32-bytes-minimum-only
app.jwt.expiration=3600000
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.connectiontimeout=100
spring.mail.properties.mail.smtp.timeout=100
spring.mail.properties.mail.smtp.writetimeout=100
app.mail.from=test@example.invalid
app.registration.blocked-domains=example.invalid
app.registration.code-expiration-minutes=10
app.registration.resend-cooldown-seconds=60
app.registration.max-verification-attempts=5
app.registration.cleanup-interval-ms=86400000
app.features.item-auctions-enabled=true
app.features.pln-auctions-enabled=true
app.auctions.attempt-spacing-seconds=0
app.auctions.attempts-per-minute=100000
logging.level.root=WARN
