openapi: 3.0.1
info:
  description: |-
    REST API giełdy graczy Margonem: ogłoszenia przedmiotów i złota, aukcje, rozmowy, komentarze, opinie o sprzedających, ceny oraz panel administracji.

    Uwierzytelnianie: token JWT z `POST /api/auth/login` przekazywany w nagłówku `Authorization: Bearer <token>` (przycisk **Authorize**). Publiczne endpointy GET działają bez tokenu, a `/api/admin/**` wymaga roli ADMIN.

    Kwoty w PLN są podawane w groszach, a złoto w pojedynczych jednostkach. Czat w czasie rzeczywistym (STOMP, `/ws/conversations`) nie jest częścią tej specyfikacji.
  title: MargoMarket API
  version: v1
servers:
- description: Generated server url
  url: http://localhost
security:
- bearerAuth: []
tags:
- description: Wiadomości między kupującym a sprzedającym
  name: Rozmowy
- description: Publiczne profile sprzedających
  name: Profile
- description: Potwierdzanie zakończonych transakcji
  name: Potwierdzenia wymian
- description: Katalog przedmiotów gry
  name: Przedmioty
- description: Sprzedaż i kupno złota
  name: Ogłoszenia złota
- description: "Rejestracja, logowanie i ustawienia konta"
  name: Konto i logowanie
- description: Odświeżanie katalogu przedmiotów
  name: "Administracja: katalog"
- description: Ogłoszenia przedmiotów i ulubione
  name: Ogłoszenia
- description: Powiadomienia użytkownika
  name: Powiadomienia
- description: Dyskusja pod ogłoszeniami
  name: Komentarze
- description: "Aukcje przedmiotów, licytacje i rozliczenia"
  name: Aukcje
- description: "Unieważnianie ofert, zgłoszenia i ograniczenia aukcyjne"
  name: "Administracja: aukcje"
- description: Zarządzanie światami gry
  name: "Administracja: światy"
- description: Ograniczenia kont i ich historia
  name: Moderacja użytkowników
- description: Historia i sugestie cen przedmiotów
  name: Ceny
- description: Opinie o sprzedających po potwierdzonych wymianach
  name: Opinie
- description: Statystyki serwisu
  name: "Administracja: statystyki"
- description: "Serwery, kategorie i inne dane do filtrów i formularzy"
  name: Słowniki
- description: Przegląd użytkowników i ogłoszeń
  name: Administracja
- description: Słownik moderacji tekstu
  name: "Administracja: blokowane słowa"
