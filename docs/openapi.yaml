components:
  schemas:
    ListingRequest:
      required:
      - currencyId
      - itemId
      - itemName
      - itemTypeId
      - level
      - price
      - rarityId
      - serverId
      type: object
      properties:
        itemId:
          type: integer
          format: int64
        itemName:
          maxLength: 255
          minLength: 3
          type: string
        itemTypeId:
          type: integer
          format: int64
        level:
          maximum: 300
          minimum: 1
          type: integer
          format: int32
        enhancementLevel:
          maximum: 5
          minimum: 0
          type: integer
          format: int32
        bound:
          type: boolean
        rarityId:
          type: integer
          format: int64
        price:
          maximum: 10000000000000
          minimum: 1
          type: integer
          format: int64
        currencyId:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        contact:
          maxLength: 50
          minLength: 0
          type: string
    AuctionSummary:
      type: object
      properties:
        currency:
          type: string
        startingAmount:
          type: integer
          format: int64
        highestAmount:
          type: integer
          format: int64
        bidCount:
          type: integer
          format: int64
        endsAt:
          type: string
          format: date-time
        status:
          type: string
    ListingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        itemId:
          type: integer
          format: int64
        itemName:
          type: string
        iconUrl:
          type: string
        itemDescription:
          type: string
        itemStats:
          type: string
        itemType:
          $ref: "#/components/schemas/LookupResponse"
        level:
          type: integer
          format: int32
        enhancementLevel:
          type: integer
          format: int32
        bound:
          type: boolean
        rarity:
          $ref: "#/components/schemas/LookupResponse"
        price:
          type: integer
          format: int64
        currency:
          $ref: "#/components/schemas/LookupResponse"
        server:
          $ref: "#/components/schemas/LookupResponse"
        contact:
          type: string
        status:
          type: string
        sellerId:
          type: integer
          format: int64
        sellerDisplayName:
          type: string
        createdAt:
          type: string
          format: date-time
        listingKind:
          type: string
        goldAmount:
          type: integer
          format: int64
        priceMinor:
          type: integer
          format: int64
        goldRateMode:
          type: string
        rateGoldUnits:
          type: integer
          format: int64
        ratePriceMinor:
          type: integer
          format: int64
        description:
          type: string
        soldAt:
          type: string
          format: date-time
        saleMode:
          type: string
        auction:
          $ref: "#/components/schemas/AuctionSummary"
    LookupResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    GoldListingRequest:
      required:
      - goldAmount
      - rateGoldUnits
      - rateMode
      - ratePriceMinor
      - serverId
      type: object
      properties:
        serverId:
          type: integer
          format: int64
        goldAmount:
          maximum: 9000000000000000
          minimum: 1
          type: integer
          format: int64
        rateMode:
          pattern: M_PER_PLN|PLN_PER_G
          type: string
        rateGoldUnits:
          maximum: 9000000000000000
          minimum: 1
          type: integer
          format: int64
        ratePriceMinor:
          maximum: 100000000
          minimum: 1
          type: integer
          format: int64
        description:
          maxLength: 2000
          minLength: 0
          type: string
        contact:
          maxLength: 50
          minLength: 0
          type: string
    ChangePasswordRequest:
      required:
      - currentPassword
      - newPassword
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          maxLength: 72
          minLength: 6
          type: string
