components:
  schemas:
    Action:
      type: object
      properties:
        action:
          type: string
        reason:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - action
    AdminUserRowResponse:
      type: object
      properties:
        stats:
          $ref: "#/components/schemas/UserStats"
        user:
          $ref: "#/components/schemas/UserResponse"
    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
        validation:
          type: object
          additionalProperties:
            type: string
    AuctionRequest:
      type: object
      properties:
        bound:
          type: boolean
        contact:
          type: string
          maxLength: 50
          minLength: 0
        currency:
          type: string
          pattern: PLN|GOLD
        description:
          type: string
          maxLength: 2000
          minLength: 0
        endsAt:
          type: string
          format: date-time
        enhancementLevel:
          type: integer
          format: int32
          maximum: 5
          minimum: 0
        itemId:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        startingAmount:
          type: integer
          format: int64
      required:
      - currency
      - endsAt
      - enhancementLevel
      - itemId
      - serverId
      - startingAmount
    AuctionResponse:
      type: object
      properties:
        bidCount:
          type: integer
          format: int64
        biddingRestriction:
          type: string
        contactReminder:
          type: boolean
        conversationId:
          type: integer
          format: int64
        currency:
          type: string
        endsAt:
          type: string
          format: date-time
        fulfillmentStatus:
          type: string
        highestAmount:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        leading:
          type: boolean
        listing:
          $ref: "#/components/schemas/ListingResponse"
        nextMinimumBid:
          type: integer
          format: int64
        originalEndsAt:
          type: string
          format: date-time
        owner:
          type: boolean
        serverTime:
          type: string
          format: date-time
        startingAmount:
          type: integer
          format: int64
        status:
          type: string
        version:
          type: integer
          format: int64
        winner:
          type: boolean
        winnerDisplayName:
          type: string
        winnerId:
          type: integer
          format: int64
    AuctionSummary:
      type: object
      properties:
        bidCount:
          type: integer
          format: int64
        currency:
          type: string
        endsAt:
          type: string
          format: date-time
        highestAmount:
          type: integer
          format: int64
        startingAmount:
          type: integer
          format: int64
        status:
          type: string
    BlockedWord:
      type: object
      properties:
        enabled:
          type: boolean
        id:
          type: integer
          format: int64
        matchMode:
          type: string
          enum:
          - EXACT
          - PREFIX
        term:
          type: string
    BlockedWordRequest:
      type: object
      properties:
        enabled:
          type: boolean
        matchMode:
          type: string
          enum:
          - EXACT
          - PREFIX
        term:
          type: string
          maxLength: 80
          minLength: 0
      required:
      - enabled
      - matchMode
      - term
    ChangeDisplayNameRequest:
      type: object
      properties:
        currentPassword:
          type: string
        displayName:
          type: string
          pattern: "[\\p{L}\\p{N}_. -]{3,32}"
      required:
      - currentPassword
      - displayName
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          maxLength: 72
          minLength: 6
      required:
      - currentPassword
      - newPassword
    ChatMessageRequest:
      type: object
      properties:
        body:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - body
    ChatMessageResponse:
      type: object
      properties:
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        kind:
          type: string
        senderDisplayName:
          type: string
        senderId:
          type: integer
          format: int64
        senderRole:
          type: string
    CloseConversationRequest:
