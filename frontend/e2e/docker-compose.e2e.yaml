# Isolated stack for the Playwright tests: own database and backend on ports that do not clash
# with the development stack (8080/5432). Start: docker compose -f e2e/docker-compose.e2e.yaml up -d --build --wait
name: margomarket-e2e
services:
  app:
    build:
      context: ../..
    container_name: margomarket-e2e-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ITEM_AUCTIONS_ENABLED: "false"
      PLN_AUCTIONS_ENABLED: "false"
      GOLD_LISTINGS_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"
      FORWARD_HEADERS_STRATEGY: none
      SWAGGER_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/e2e
      SPRING_DATASOURCE_USERNAME: e2e
      SPRING_DATASOURCE_PASSWORD: e2e
      CORS_ALLOWED_ORIGINS: http://localhost:4300
      JWT_SECRET: e2e-only-secret-that-is-at-least-32-bytes-long
      JWT_EXPIRATION: "3600000"
      # Registration mail is never sent: the test account is created directly in the database.
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_USERNAME: e2e
      MAIL_PASSWORD: e2e
      MAIL_FROM: e2e@example.invalid
      MAIL_CONNECTION_TIMEOUT_MS: "1000"
      MAIL_READ_TIMEOUT_MS: "1000"
      MAIL_WRITE_TIMEOUT_MS: "1000"
      REGISTRATION_CODE_EXPIRATION_MINUTES: "10"
      REGISTRATION_RESEND_COOLDOWN_SECONDS: "60"
      REGISTRATION_MAX_VERIFICATION_ATTEMPTS: "5"
      REGISTRATION_CLEANUP_INTERVAL_MS: "86400000"
      BLOCKED_EMAIL_DOMAINS: mailinator.com
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: margomarket-e2e-postgres
    environment:
      POSTGRES_DB: e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 3s
      timeout: 3s
      retries: 20
